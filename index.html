<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Criar Formulário</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="form">     
    <div class="form__container">
        <h1 class="form__title">Criar Onboarding</h1>

        <input class="form__input" id="clientName" placeholder="Nome do cliente">

        <h3>Importação de Conteúdo</h3>
        <div class="form__group">
            <label><input type="checkbox" value="Hotmart"> Hotmart</label>
            <label><input type="checkbox" value="Eduzz"> Eduzz</label>
            <label><input type="checkbox" value="Kiwify"> Kiwify</label>
        </div>

        <h3>Integrações</h3>
        <div class="form__group">
            <label><input type="checkbox" value="ActiveCampaign"> ActiveCampaign</label>
            <label><input type="checkbox" value="Botconversa"> Botconversa</label>
            <label><input type="checkbox" value="AstronMembers"> Astron Members</label>
            <label><input type="checkbox" value="Utmify"> Utmify</label>
        </div>

        <button class="form__button" onclick="createForm()">Gerar Link</button>

        <p id="result"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="supabaseClient.js"></script>
    <script src="app.js"></script>
</body>

</html>
